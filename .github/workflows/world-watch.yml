name: Update and deploy World Watch

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3,9,15,21 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: world-watch-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Find World Watch files
        shell: bash
        run: |
          PROJECT_DIR="$(dirname "$(find . -type f -name updater.py -print -quit)")"

          if [ -z "$PROJECT_DIR" ]; then
            echo "Could not find updater.py anywhere in the repository."
            exit 1
          fi

          echo "World Watch found in: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Files found:"
          ls -la "$PROJECT_DIR"

      - name: Run World Watch monitor
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          python updater.py

      - name: Save monitoring results
        shell: bash
        run: |
          git config user.name "world-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$PROJECT_DIR/auto_updates.json"
          git add "$PROJECT_DIR/monitor_state.json"
          git add "$PROJECT_DIR/monitor_health.json"

          git diff --cached --quiet || git commit -m "Automatic World Watch update"
          git push || true

      - name: Prepare website
        shell: bash
        run: |
          mkdir -p _site

          cp "$PROJECT_DIR/index.html" _site/
          cp "$PROJECT_DIR/updates.json" _site/
          cp "$PROJECT_DIR/auto_updates.json" _site/

          touch _site/.nojekyll

          echo "Website files:"
          ls -la _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
