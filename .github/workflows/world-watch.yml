name: Update and deploy World Watch

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["World Watch PDF reading pilot", "World Watch local AI summary pilot"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - ".github/workflows/world-watch.yml"
      - "world_watch_self_updating_github (1)/index.html"
      - "world_watch_self_updating_github (1)/updater.py"
      - "world_watch_self_updating_github (1)/updates.json"
  schedule:
    - cron: "20 3,9,15,21 * * *"

permissions:
  contents: read

concurrency:
  group: world-watch-pages
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  update:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: pip install requests beautifulsoup4

      - name: Find World Watch files
        shell: bash
        run: |
          PROJECT_DIR="./world_watch_self_updating_github (1)"

          if [ ! -f "$PROJECT_DIR/updater.py" ]; then
            echo "Could not find updater.py anywhere in the repository."
            exit 1
          fi

          echo "World Watch found in: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Files found:"
          ls -la "$PROJECT_DIR"

      - name: Run World Watch monitor
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          python updater.py

      - name: Save monitoring results
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git config user.name "world-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$PROJECT_DIR/auto_updates.json"
          git add "$PROJECT_DIR/monitor_state.json"
          git add "$PROJECT_DIR/monitor_health.json"

          if ! git diff --cached --quiet; then
            git commit -m "Automatic World Watch update"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            echo "Could not save monitor results safely; no force push attempted."
            exit 1
          fi

      - name: Prepare website
        shell: bash
        run: |
          mkdir -p _site

          cp "$PROJECT_DIR/index.html" _site/
          cp "$PROJECT_DIR/updates.json" _site/
          cp "$PROJECT_DIR/auto_updates.json" _site/
          cp "$PROJECT_DIR/monitor_health.json" _site/
          cp "$PROJECT_DIR/pdf_summaries.json" _site/
          cp "$PROJECT_DIR/ai_summaries.json" _site/

          touch _site/.nojekyll

          echo "Website files:"
          ls -la _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site"
          retention-days: 1

  deploy:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify public website contains new menu
        shell: bash
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location --max-time 15 "${SITE_URL}?build=${GITHUB_SHA}&attempt=${attempt}" -o /tmp/world-watch-live.html && grep -q 'strategic-menu-20261126' /tmp/world-watch-live.html && grep -q 'id="reportSortButtons"' /tmp/world-watch-live.html && grep -q 'id="strategicMenu"' /tmp/world-watch-live.html && grep -q 'id="pdfReadingPanel"' /tmp/world-watch-live.html && grep -q 'id="aiRoboticsMenu"' /tmp/world-watch-live.html && grep -q 'Strategic edition · v2.5' /tmp/world-watch-live.html; then
              echo "Verified public HTML: strategic menu, report sorting buttons and PDF reading panel are present."
              exit 0
            fi
            sleep 10
          done
          echo "Public site did not return the expected menu yet."
          exit 1
