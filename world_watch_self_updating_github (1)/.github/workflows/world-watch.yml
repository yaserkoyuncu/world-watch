name: Update and deploy World Watch

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3,9,15,21 * * *"
  push:
    branches:
      - main
    paths-ignore:
      - "auto_updates.json"
      - "monitor_state.json"
      - "monitor_health.json"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: world-watch-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run World Watch monitor
        run: python updater.py

      - name: Persist monitor state
        run: |
          git config user.name "world-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auto_updates.json monitor_state.json monitor_health.json
          git diff --cached --quiet || git commit -m "Auto-update World Watch"
          git push || true

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
